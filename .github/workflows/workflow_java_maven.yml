# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn -B package --file pom.xml
  build-and-push-docker:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # 1. Copia el código fuente de tu repositorio al runner
      - name: Descargar codigo
        uses: actions/checkout@v4

        # 2. Prepara el entorno BuildKit de Docker para compilaciones avanzadas
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

        # 3. Inicia sesión en Docker Hub usando los Secrets
      - name: Iniciar sesion en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # 4. Construye la imagen con tu Dockerfile y la sube a Docker Hub
      - name: Construir y subir imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/imagen_spring_java:0.1